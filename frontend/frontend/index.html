<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/archreactor-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ULTRON | Tactical AI Safety Assistant</title>
    <meta name="theme-color" content="#0d0d12" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[ULTRON PWA] Service Worker active, scope:', reg.scope))
            .catch(err => console.warn('[ULTRON PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
